<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body {padding: 16px; color: #ddd; background: #252525; font-size: 13px;}
h2 {font-size: 20px; margin-bottom: 12px;}
p {margin: 8px 0;}
input {width: 100%; margin: 12px 0;}
button {margin-right: 8px; margin-bottom: 12px;}
#status {white-space: normal; overflow-wrap: break-word;}
</style></head>
<body>
<h2>Bubble Premiere Pro</h2>
<p>在 Codex 请求连接码，粘贴后连接。每个面板对应一个独立会话。</p>
<input id="code" type="password" placeholder="连接码（仅当前面板保存）">
<button id="connect">连接</button><button id="disconnect">断开</button>
<p id="status">未连接</p>
<p>保持面板打开。Codex 重启后需重新配对。项目切换后，请重新选择项目。</p>
<script src="panel.js"></script>
</body></html>
